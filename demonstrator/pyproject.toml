[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthome-demonstrator"
version = "0.1.0"
description = "Local-first, event-driven smart-home demonstrator (Aufgabe 1b, Heterogeneous Computing SS2026)"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "amqtt>=0.11",
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ollama>=0.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
smarthome = "smarthome.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
